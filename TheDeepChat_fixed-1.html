<!-- Firebase (gerçek, paylaşılan, kalıcı veritabanı için) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --bg-secondary:#f2f7fe;
    --panel:#ffffff;
    --panel-2:#f8fbff;
    --accent:#1877d1;
    --accent2:#3fa7ff;
    --accent-dark:#0f5aa6;
    --text:#0d1e33;
    --text-muted:#63748c;
    --bubble-out-a:#1877d1;
    --bubble-out-b:#2f93ff;
    --bubble-out-text:#ffffff;
    --bubble-in:#f0f4fa;
    --bubble-in-text:#0d1e33;
    --border:#e1ebfa;
    --danger:#b30000;
    --shadow-sm:0 1px 3px rgba(20,60,120,.06);
    --shadow-md:0 8px 24px rgba(20,60,120,.10);
    --shadow-glow:0 0 0 4px rgba(24,119,209,.12);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
  }
  body.dark{
    --bg:#05080f;
    --bg-secondary:#0a1220;
    --panel:#0b1424;
    --panel-2:#0e1a2e;
    --accent:#3f96ff;
    --accent2:#7cc4ff;
    --accent-dark:#1877d1;
    --text:#eaf2ff;
    --text-muted:#7d92b3;
    --bubble-out-a:#1877d1;
    --bubble-out-b:#2f93ff;
    --bubble-out-text:#ffffff;
    --bubble-in:#131f34;
    --bubble-in-text:#eaf2ff;
    --border:#182742;
    --danger:#ff2020;
    --shadow-sm:0 1px 3px rgba(0,0,0,.3);
    --shadow-md:0 12px 32px rgba(0,0,0,.45);
    --shadow-glow:0 0 0 4px rgba(63,150,255,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  html,body{height:calc(var(--vh, 1vh) * 100);}
  @supports (height: 100dvh){
    html,body{height:100dvh;}
  }
  html{position:fixed;inset:0;width:100%;overflow:hidden;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg-secondary);
    color:var(--text);
    display:flex;
    align-items:stretch;
    justify-content:center;
    transition:background .3s ease, color .3s ease;
    -webkit-font-smoothing:antialiased;
    position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;
  }
  h1,h2,h3,.brand,.uname,.name{font-family:'Plus Jakarta Sans', 'Inter', sans-serif;}
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:calc(var(--vh, 1vh) * 100);
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:var(--shadow-md);
    overflow:hidden;
  }
  @supports (height: 100dvh){
    #app{min-height:100dvh;}
  }
  @media (min-width:620px){
    body{
      padding:26px 0;
      background:
        radial-gradient(900px circle at 10% 0%, rgba(24,119,209,.10), transparent 55%),
        radial-gradient(900px circle at 90% 100%, rgba(63,150,255,.10), transparent 55%),
        var(--bg-secondary);
    }
    #app{
      min-height:calc(100vh - 52px);
      min-height:calc(var(--vh, 1vh) * 100 - 52px);
      border-radius:28px;
      box-shadow:0 30px 70px rgba(15,50,100,.22), 0 0 0 1px var(--border);
    }
    @supports (height: 100dvh){
      #app{min-height:calc(100dvh - 52px);}
    }
    body.dark #app{box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 1px var(--border);}
  }
  /* ---- top bar ---- */
  .topbar{
    background:linear-gradient(135deg, var(--bubble-out-a) 0%, var(--bubble-out-b) 100%);
    color:#fff;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:700;
    font-size:18px;
    flex-shrink:0;
    box-shadow:0 4px 18px rgba(24,119,209,.25);
    position:relative;
    z-index:2;
  }
  .topbar .back{
    cursor:pointer;
    font-size:20px;
    padding:2px 8px;
    user-select:none;
    border-radius:10px;
    transition:background .15s;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .topbar .back:hover{background:rgba(255,255,255,.15);}
  .topbar .sub{
    font-size:12px;
    font-weight:400;
    opacity:.88;
    margin-top:2px;
    font-family:'Inter',sans-serif;
  }
  .topbar-user{display:flex;flex-direction:column;flex:1;min-width:0;}
  .topbar-user .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
  .avatar{
    width:42px;height:42px;border-radius:50%;
    background:var(--bg-secondary);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--accent);
    overflow:hidden;flex-shrink:0;
    border:2.5px solid rgba(255,255,255,.55);
    font-size:15px;
    font-family:'Plus Jakarta Sans',sans-serif;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  #admin-exit{background:rgba(255,255,255,.18);color:#fff;}
  /* ---- auth screen ---- */
  .center-screen{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 30px;gap:14px;position:relative;
    background:
      radial-gradient(600px circle at 15% -10%, rgba(24,119,209,.14), transparent 55%),
      radial-gradient(500px circle at 110% 10%, rgba(63,150,255,.12), transparent 50%);
  }
  body.dark .center-screen{
    background:
      radial-gradient(600px circle at 15% -10%, rgba(63,150,255,.16), transparent 55%),
      radial-gradient(500px circle at 110% 10%, rgba(24,119,209,.18), transparent 50%);
  }
  .brand{
    font-size:38px;font-weight:800;letter-spacing:-0.6px;margin-bottom:2px;
    display:flex;align-items:center;gap:0;justify-content:center;white-space:nowrap;
  }
  .brand .brand-mid{
    background:linear-gradient(135deg, var(--accent) 10%, var(--accent2) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;
  }
  .brand span{-webkit-text-fill-color:var(--text);color:var(--text);}
  .brand .brand-the{-webkit-text-fill-color:var(--text);color:var(--text);}
  .brand-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .brand-logo{width:46px;height:46px;margin-bottom:10px;}
  .brand-logo svg,.brand-logo img{width:100%;height:100%;display:block;object-fit:contain;}
  .tagline{color:var(--text-muted);font-size:13.5px;margin-bottom:16px;text-align:center;}
  .field{width:100%;}
  .field label{font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;font-weight:600;letter-spacing:.2px;}
  input[type=text], input[type=password], textarea{
    width:100%;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    font-size:14.5px;
    outline:none;
    font-family:'Inter',sans-serif;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus{border-color:var(--accent);box-shadow:var(--shadow-glow);}
  .btn{
    width:100%;
    padding:13px;
    border-radius:var(--radius-sm);
    border:none;
    background:linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
    box-shadow:0 6px 16px rgba(24,119,209,.28);
    transition:transform .12s, box-shadow .12s, opacity .12s;
    font-family:'Plus Jakarta Sans',sans-serif;
    letter-spacing:.1px;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(24,119,209,.35);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{
    background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none;
  }
  .btn.danger{background:linear-gradient(135deg, var(--danger), #7a0000);box-shadow:0 6px 16px rgba(179,0,0,.35);}
  .link-btn{
    background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;margin-top:6px;font-weight:600;
  }
  .error-msg{color:var(--danger);font-size:12.5px;min-height:16px;font-weight:500;}
  /* ---- main layout ---- */
  .content{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);}
  .search-wrap{padding:12px 14px;background:var(--bg);flex-shrink:0;}
  .search-box{position:relative;}
  .search-box input{padding-left:42px !important;}
  .search-icon-el{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;z-index:1;}
  .search-icon-el svg{width:17px;height:17px;display:block;}
  .search-wrap input{background:var(--bg-secondary);border-radius:999px;padding-left:18px;}
  .user-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
    transition:background .15s;
  }
  .user-row:hover{background:var(--bg-secondary);}
  .user-row .info{flex:1;min-width:0;}
  .user-row .uname{font-weight:700;font-size:15px;letter-spacing:-.1px;}
  .user-row .uname.unread-name{font-weight:800;}
  .user-row .preview{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .user-row .preview.unread-prev{color:var(--text);font-weight:600;}
  .user-row .meta-col{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .unread-dot{
    background:linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));
    width:10px;height:10px;border-radius:999px;display:inline-block;
    box-shadow:0 0 0 3px var(--bg);
  }
  .empty-hint{padding:40px 24px;text-align:center;color:var(--text-muted);font-size:13.5px;line-height:1.5;}
  .fab{
    position:absolute;right:18px;bottom:86px;width:54px;height:54px;border-radius:50%;border:none;
    background:linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));color:#fff;font-size:22px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;
    box-shadow:0 10px 22px rgba(24,119,209,.4);transition:transform .15s;
  }
  .fab:hover{transform:translateY(-2px) scale(1.03);}
  /* ---- tab bar ---- */
  .tabbar{
    display:flex;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -4px 16px rgba(20,60,120,.05);
  }
  .tabbar button{
    flex:1;background:none;border:none;padding:8px 0;color:var(--text-muted);font-size:11.5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;
    transition:background .15s, color .15s;font-weight:600;
  }
  .tabbar button.active{color:var(--accent);background:var(--bg-secondary);}
  .tabbar button .icon{font-size:19px;}
  /* ---- chat view ---- */
  .messages{
    flex:1;overflow-y:auto;padding:16px 14px 20px;display:flex;flex-direction:column;gap:3px;
    background-color:var(--bg-secondary);
    background-image:
      radial-gradient(circle at 8px 8px, rgba(24,119,209,.05) 1.6px, transparent 1.7px);
    background-size:34px 34px;
    position:relative;
  }
  body.dark .messages{
    background-image:
      radial-gradient(circle at 8px 8px, rgba(63,150,255,.07) 1.6px, transparent 1.7px);
  }
  .bubble{
    max-width:76%;padding:8px 13px 7px;border-radius:14px;font-size:14.5px;line-height:1.4;position:relative;
    box-shadow:var(--shadow-sm);
    animation:pop .16s ease;
    margin:3px 0;
  }
  @keyframes pop{ from{opacity:0;transform:translateY(4px) scale(.98);} to{opacity:1;transform:none;} }
  .bubble.out{align-self:flex-end;background:linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));color:var(--bubble-out-text);border-bottom-right-radius:3px;margin-right:6px;}
  .bubble.in{align-self:flex-start;background:var(--bubble-in);color:var(--bubble-in-text);border-bottom-left-radius:3px;margin-left:6px;}
  .bubble.out::after{
    content:"";position:absolute;right:-6px;bottom:0;width:0;height:0;
    border:7px solid transparent;border-left-color:var(--bubble-out-b);border-bottom:0;border-right:0;
  }
  .bubble.in::after{
    content:"";position:absolute;left:-6px;bottom:0;width:0;height:0;
    border:7px solid transparent;border-right-color:var(--bubble-in);border-bottom:0;border-left:0;
  }
  .bubble img, .bubble video{max-width:100%;border-radius:10px;display:block;margin-top:4px;}
  .bubble .time{font-size:10px;opacity:.75;margin-top:4px;text-align:right;letter-spacing:.2px;}
  .day-divider{
    align-self:center;background:var(--panel);color:var(--text-muted);font-size:11px;font-weight:600;
    padding:4px 12px;border-radius:999px;box-shadow:var(--shadow-sm);margin:10px 0 6px;
  }
  .chat-input-bar{
    display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;
  }
  .chat-input-bar input[type=text]{flex:1;border-radius:999px;background:var(--bg-secondary);}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:none;background:var(--bg-secondary);color:var(--accent);
    font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    transition:transform .12s, background .12s;
  }
  .icon-btn:hover{transform:translateY(-1px);}
  .icon-btn.send{background:linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));color:#fff;box-shadow:0 4px 12px rgba(24,119,209,.35);}
  /* ---- status ---- */
  .status-row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);}
  .status-ring{
    width:50px;height:50px;border-radius:50%;padding:2.5px;flex-shrink:0;
    background:conic-gradient(from 180deg, var(--accent2), var(--accent), var(--accent2));
  }
  .status-ring .avatar{width:100%;height:100%;border:2.5px solid var(--panel);}
  .status-text{font-size:13.5px;}
  .status-time{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .add-status-box{padding:16px;border-bottom:8px solid var(--bg-secondary);background:var(--panel-2);}
  /* ---- settings ---- */
  .settings-section{padding:18px 16px;}
  .profile-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0 24px;border-bottom:1px solid var(--border);}
  .profile-card .avatar{width:92px;height:92px;font-size:32px;border-width:3px;box-shadow:var(--shadow-md);}
  .settings-item{
    display:flex;justify-content:space-between;align-items:center;padding:15px 4px;border-bottom:1px solid var(--border);font-size:14.5px;font-weight:500;
  }
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.2s;}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  input:checked + .slider{background:linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));}
  input:checked + .slider:before{transform:translateX(20px);}
  /* ---- modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(5,10,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;
    backdrop-filter:blur(3px);
  }
  .modal{
    background:var(--panel);border-radius:var(--radius-lg);padding:22px;width:88%;max-width:380px;display:flex;flex-direction:column;gap:10px;
    max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-md);
  }
  .modal h3{margin:0 0 4px 0;}
  .hidden{display:none !important;}
  .file-hidden{display:none;}
  small.hint{color:var(--text-muted);font-size:11px;line-height:1.5;display:block;margin-top:10px;}
  .admin-badge{
    background:linear-gradient(135deg, var(--danger), #7a0000);color:#fff;font-size:9.5px;padding:3px 8px;border-radius:999px;margin-left:6px;font-weight:800;letter-spacing:.4px;vertical-align:middle;
  }
  table.admin-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  table.admin-table th{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  table.admin-table th,table.admin-table td{border-bottom:1px solid var(--border);padding:10px 6px;text-align:left;}
  table.admin-table tr:hover td{background:var(--bg-secondary);}
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s, transform .3s;
    pointer-events:none;font-weight:600;box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  /* ---- calls ---- */
  .call-overlay{
    position:fixed;inset:0;background:linear-gradient(160deg,#05121f,#0a1e33 60%, #05121f);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    z-index:200;color:#fff;padding:40px 24px calc(30px + env(safe-area-inset-bottom,0px));
  }
  .call-top{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:30px;}
  .call-avatar{
    width:110px;height:110px;border-radius:50%;overflow:hidden;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .call-avatar img{width:100%;height:100%;object-fit:cover;}
  .call-name{font-size:22px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;}
  .call-status{font-size:14px;color:#9db3d1;}
  .call-video-wrap{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;}
  .call-video-wrap video#remote-video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:0;background:#000;}
  .call-video-wrap video#local-video{
    position:absolute;bottom:14px;right:14px;width:96px;height:132px;border-radius:14px;object-fit:cover;
    box-shadow:0 6px 20px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25);background:#000;z-index:2;
  }
  .call-controls{display:flex;gap:22px;align-items:center;justify-content:center;margin-top:20px;}
  .call-btn{
    width:58px;height:58px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:rgba(255,255,255,.12);color:#fff;transition:transform .12s, background .12s;
  }
  .call-btn:hover{transform:translateY(-2px);}
  .call-btn.active{background:rgba(255,255,255,.28);}
  .call-btn.end{background:linear-gradient(135deg, var(--danger), #7a0000);}
  .call-btn.accept{background:linear-gradient(135deg,#2fd06c,#1fae55);}
  .call-btn svg{width:24px;height:24px;}
  .call-incoming-actions{display:flex;gap:34px;margin-top:16px;}
  .call-incoming-actions .call-btn{width:64px;height:64px;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  /* ---- icon sizing (modern svg icons, no emoji) ---- */
  .icon-btn svg{width:19px;height:19px;display:block;}
  .back svg{width:22px;height:22px;display:block;}
  .fab svg{width:23px;height:23px;display:block;}
  .tabbar button .icon svg{width:21px;height:21px;display:block;margin:0 auto;}
  .tick-icon{display:inline-flex;vertical-align:-2px;margin-right:2px;}
  .tick-icon svg, .tick-icon img{width:13px;height:13px;display:block;}
  .verified-badge{margin-left:4px;margin-right:0;vertical-align:-3px;display:inline-flex;}
  .verified-badge svg, .verified-badge img{width:16px;height:16px;}
  .badge-img{width:100%;height:100%;object-fit:contain;}
  .admin-toggle-tick{
    border:none;cursor:pointer;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;
    color:#fff;background:linear-gradient(135deg, var(--bubble-out-a), var(--bubble-out-b));
  }
  .admin-toggle-tick.off{background:var(--border);color:var(--text-muted);}
  .preview svg{width:12px;height:12px;vertical-align:-1.5px;margin-right:3px;opacity:.85;}
  .empty-hint svg{width:34px;height:34px;color:var(--border);margin-bottom:10px;}
  /* ---- top circular action buttons (Kişiler tab) ---- */
  .top-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .circle-btn{
    width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s,transform .12s;
  }
  .circle-btn:hover{background:rgba(255,255,255,.28);transform:translateY(-1px);}
  .circle-btn svg{width:18px;height:18px;display:block;}
  .contacts-header{display:flex;align-items:center;padding:12px 14px 0;}
  .contacts-header .search-wrap{flex:1;padding:0;margin-right:14px;}
  /* ---- long-press bottom sheet (message actions / row actions) ---- */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;
    backdrop-filter:blur(2px);
  }
  .sheet{
    width:100%;max-width:480px;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:sheetUp .18s ease;
  }
  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet .sheet-handle{width:38px;height:4px;background:var(--border);border-radius:4px;margin:2px auto 8px;}
  .sheet-item{
    display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;font-size:14.5px;font-weight:600;
    transition:background .12s;
  }
  .sheet-item:hover{background:var(--bg-secondary);}
  .sheet-item.danger{color:var(--danger);}
  .sheet-item svg{width:19px;height:19px;flex-shrink:0;}
  /* ---- profile modal ---- */
  .profile-modal-avatar{width:104px;height:104px;font-size:36px;border-width:3px;margin:0 auto 6px;}
  .profile-modal-name{text-align:center;font-weight:800;font-size:17px;font-family:'Plus Jakarta Sans',sans-serif;}
  .profile-modal-sub{text-align:center;color:var(--text-muted);font-size:12.5px;margin-top:2px;}
  .profile-modal-bio{background:var(--panel-2);border-radius:var(--radius-sm);padding:12px 14px;margin-top:14px;font-size:14px;color:var(--text);line-height:1.5;min-height:20px;}
  .profile-modal-bio-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:4px;}
  /* ---- online / deleted state ---- */
  .online-dot{width:8px;height:8px;border-radius:50%;background:#2fd06c;display:inline-block;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 2px var(--panel);}
  .bubble.deleted{opacity:.65;font-style:italic;}
  .bubble .sender-name{font-size:11.5px;font-weight:700;margin-bottom:2px;opacity:.85;color:var(--accent);}
  body.dark .bubble.in .sender-name{color:var(--accent2);}
  /* ---- contacts / group avatar picker ---- */
  .avatar-picker{
    width:96px;height:96px;border-radius:50%;background:var(--panel-2);border:2px dashed var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;margin:4px auto 10px;overflow:hidden;flex-shrink:0;
  }
  .avatar-picker img{width:100%;height:100%;object-fit:cover;}
  .avatar-picker svg{width:26px;height:26px;}
  .member-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);}
  .member-row .info{flex:1;min-width:0;}
  .member-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);}
  .role-badge{font-size:10px;color:var(--text-muted);font-weight:700;background:var(--panel-2);padding:2px 8px;border-radius:999px;}
  .contact-row-actions{display:flex;gap:8px;margin-left:auto;flex-shrink:0;}
  .mini-circle{
    width:32px;height:32px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .mini-circle.accept{background:linear-gradient(135deg,#2fd06c,#1fae55);color:#fff;}
  .mini-circle.reject{background:linear-gradient(135deg, var(--danger), #7a0000);color:#fff;}
  .mini-circle svg{width:16px;height:16px;}
  .selected-row{background:rgba(24,119,209,.10);}
  .bubble.deleted .del-icon{width:14px;height:14px;display:inline-flex;vertical-align:-2px;margin-right:4px;flex-shrink:0;}
  .bubble.deleted .del-icon svg{width:14px;height:14px;display:block;}
  .grp-add-inline{display:inline-flex;align-items:center;gap:6px;align-self:flex-end;background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .12s;}
  .grp-add-inline:hover{background:var(--bg-secondary);}

/* ===================== GERCEK EKRAN YUKSEKLIGI (mobil tam ekran sabitleme) =====================
   100vh, mobil tarayicilarda ve bazi PWA/standalone durumlarinda adres cubugu / arayuz
   degisikliklerine gore yanlis hesaplanabiliyor; bu da sayfa yenilendiginde uygulamanin
   telefon ekranindan buyuk gorunmesine yol aciyordu. Gercek gorunur yuksekligi JS ile
   olcup --vh degiskenine yaziyoruz ve boyut degisebilecek her durumda guncelliyoruz. */
function setRealVH(){
  const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
  // sayfa yenilendiğinde bazı mobil tarayıcılarda önceki kaydırma konumu
  // geri geliyor ve uygulama telefon ekranından taşmış gibi görünüyordu;
  // her ölçümde en üste sabitleyerek bunu engelliyoruz.
  window.scrollTo(0, 0);
}
setRealVH();
window.addEventListener('resize', setRealVH);
window.addEventListener('orientationchange', setRealVH);
window.addEventListener('pageshow', setRealVH);
window.addEventListener('load', setRealVH);
document.addEventListener('DOMContentLoaded', setRealVH);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setRealVH);
  window.visualViewport.addEventListener('scroll', setRealVH);
}
// bazı tarayıcılarda adres çubuğu animasyonu resize olayından biraz sonra
// bitiyor; ilk saniyelerde birkaç kez daha ölçüp sabitliyoruz.
[100, 300, 600, 1000, 1500].forEach(t=> setTimeout(setRealVH, t));

/* ===================== STORAGE HELPERS ===================== */
async function getUsers(){
  try{
    const snap = await db.collection('users').get();
    const users = {};
    snap.forEach(doc => { users[doc.id] = doc.data(); });
    return users;
  }catch(e){ console.error(e); return {}; }
}
async function saveUsers(u){
  // 'u' bütün kullanıcı map'i olabilir (register/profil güncellemelerinde her zaman böyle kullanılıyor).
  // Her kullanıcıyı kendi dokümanına yazıyoruz ki eş zamanlı kayıtlar birbirini ezmesin.
  try{
    const batch = db.batch();
    Object.keys(u).forEach(name=>{
      batch.set(db.collection('users').doc(name), u[name]);
    });
    await batch.commit();
  }catch(e){ console.error(e); }
}
async function deleteUser(name){
  try{ await db.collection('users').doc(name).delete(); }catch(e){ console.error(e); }
}
async function getAdminCreds(){
  try{
    const doc = await db.collection('settings').doc('admin_creds').get();
    if(doc.exists) return doc.data();
  }catch(e){ console.error(e); }
  const def = {username:'admin', password:'admin123'};
  try{ await db.collection('settings').doc('admin_creds').set(def); }catch(e){}
  return def;
}
async function saveAdminCreds(creds){

}
// Tek bir kullanıcının belgesindeki bazı alanları, tüm kullanıcı listesini
// yeniden yazmadan (daha hızlı ve çakışmasız) güncellemek için.
async function updateUserField(username, fields){
  try{ await db.collection('users').doc(username).update(fields); }
  catch(e){
    try{ await db.collection('users').doc(username).set(fields, {merge:true}); }catch(e2){ console.error(e2); }
  }
}
// Admin tarafından silinmiş / artık var olmayan bir kullanıcı için görünen ad.
function displayName(username, users){
  if(!username) return '';
  return (users && users[username]) ? username : 'Kullanıcı Silindi !';
}
function isOnline(u){
  return !!(u && u.lastActive && (Date.now() - u.lastActive) < 45000);
}
function onlineStatusText(username, users){
  const u = users && users[username];
  if(!u) return 'Kullanıcı Silindi !';
  if(isOnline(u)) return `<span class="online-dot"></span>çevrimiçi`;
  if(u.lastActive) return `son görülme ${fmtTime(u.lastActive)}`;
  return 'çevrimdışı';
}
/* ---- Kişiler (contacts) ---- */
async function addContact(me, other){
  try{
    await db.collection('users').doc(me).update({ contacts: firebase.firestore.FieldValue.arrayUnion(other) });
  }catch(e){
    try{ await db.collection('users').doc(me).set({ contacts:[other] }, {merge:true}); }catch(e2){ console.error(e2); }
  }
}
async function removeContact(me, other){
  try{
    await db.collection('users').doc(me).update({ contacts: firebase.firestore.FieldValue.arrayRemove(other) });
  }catch(e){ console.error(e); }
}
/* ---- Gruplar ---- */
async function createGroup({name, photo, description, admin, members}){
  const ref = db.collection('groups').doc();
  const data = { id: ref.id, name, photo: photo||'', description: description||'', admin, members, createdAt: Date.now() };
  try{ await ref.set(data); }catch(e){ console.error(e); }
  return data;
}
async function getGroupsFor(username){
  try{
    const snap = await db.collection('groups').where('members','array-contains',username).get();
    return snap.docs.map(d=>d.data());
  }catch(e){ console.error(e); return []; }
}
async function getGroup(id){
  try{
    const doc = await db.collection('groups').doc(id).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function updateGroup(id, fields){
  try{ await db.collection('groups').doc(id).update(fields); }catch(e){ console.error(e); }
}
async function getGroupMessages(id){
  try{
    const doc = await db.collection('groupChats').doc(id).get();
    return doc.exists ? (doc.data().messages||[]) : [];
  }catch(e){ console.error(e); return []; }
}
async function pushGroupMessage(id, msg){
  try{
    await db.collection('groupChats').doc(id).set({ messages: firebase.firestore.FieldValue.arrayUnion(msg) }, {merge:true});
  }catch(e){ console.error(e); }
}
async function leaveGroup(groupId, username){
  const g = await getGroup(groupId);
  if(!g) return;
  await updateGroup(groupId, { members: g.members.filter(m=>m!==username) });
  try{ await db.collection('users').doc(username).update({ leftGroups: firebase.firestore.FieldValue.arrayUnion(groupId) }); }catch(e){ try{ await db.collection('users').doc(username).set({ leftGroups:[groupId] }, {merge:true}); }catch(e2){} }
  try{ await db.collection('users').doc(username).set({ leftAt: { [groupId]: Date.now() } }, {merge:true}); }catch(e){}
}
async function removeLeftGroup(groupId, username){
  try{ await db.collection('users').doc(username).update({ leftGroups: firebase.firestore.FieldValue.arrayRemove(groupId) }); }catch(e){ console.error(e); }
}
async function clearGroupMessagesForMe(groupId, username){
  try{
    const ref = db.collection('groupChats').doc(groupId);
    const doc = await ref.get();
    if(!doc.exists) return;
    const msgs = doc.data().messages || [];
    const updated = msgs.map(m=>{ const df = m.deletedFor || []; if(!df.includes(username)) df.push(username); return {...m, deletedFor: df}; });
    await ref.set({messages: updated});
  }catch(e){ console.error(e); }
}
async function deleteChatForMe(other, me){
  try{
    const ref = db.collection('chats').doc(chatKey(me, other));
    const doc = await ref.get();
    if(!doc.exists) return;
    const msgs = doc.data().messages || [];
    const updated = msgs.map(m=>{ const df = m.deletedFor || []; if(!df.includes(me)) df.push(me); return {...m, deletedFor: df}; });
    await ref.set({messages: updated, hiddenAt:{ [me]: Date.now() }}, {merge:true});
  }catch(e){ console.error(e); }
}
/* ---- Mesaj silme (benden sil / herkesten sil) ---- */
async function deleteMessageForMe(chatType, id, msgId, me){
  const ref = chatType==='dm' ? db.collection('chats').doc(id) : db.collection('groupChats').doc(id);
  try{
    const doc = await ref.get();
    if(!doc.exists) return;
    const msgs = doc.data().messages || [];
    const idx = msgs.findIndex(m=>m.id===msgId);
    if(idx===-1) return;
    const deletedFor = msgs[idx].deletedFor || [];
    if(!deletedFor.includes(me)) deletedFor.push(me);
    msgs[idx] = {...msgs[idx], deletedFor};
    await ref.set({messages: msgs});
  }catch(e){ console.error(e); }
}
async function deleteMessageForEveryone(chatType, id, msgId){
  const ref = chatType==='dm' ? db.collection('chats').doc(id) : db.collection('groupChats').doc(id);
  try{
    const doc = await ref.get();
    if(!doc.exists) return;
    const msgs = doc.data().messages || [];
    const idx = msgs.findIndex(m=>m.id===msgId);
    if(idx===-1) return;

    // "Herkesten sil" hiçbir şekilde karşı tarafın mesajını silemez.
    // UI kontrolüne ek olarak burada da sahiplik doğrulaması yapıyoruz.
    if(msgs[idx].from !== state.currentUser) return;

    msgs[idx] = {...msgs[idx], deleted:true, content:''};
    await ref.set({messages: msgs});
  }catch(e){ console.error(e); }
}

async function hideChatForMe(other, me){
  try{
    await db.collection('chats').doc(chatKey(me, other)).set({ hiddenAt: { [me]: Date.now() } }, {merge:true});
  }catch(e){ console.error(e); }
}
function chatKey(a,b){ return [a,b].sort().join('::'); }
async function getMessages(a,b){
  try{
    const doc = await db.collection('chats').doc(chatKey(a,b)).get();
    return doc.exists ? (doc.data().messages || []) : [];
  }catch(e){ console.error(e); return []; }
}
async function pushMessage(a,b,msg){
  try{
    const ref = db.collection('chats').doc(chatKey(a,b));
    await ref.set({ messages: firebase.firestore.FieldValue.arrayUnion(msg) }, { merge:true });
  }catch(e){ console.error(e); }
  return await getMessages(a,b);
}
async function markMessagesRead(me, other){
  const msgs = await getMessages(me, other);
  let changed = false;
  msgs.forEach(m=>{ if(m.from === other && !m.read){ m.read = true; changed = true; } });
  if(changed){
    try{ await db.collection('chats').doc(chatKey(me, other)).set({ messages: msgs }); }catch(e){ console.error(e); }
  }
  return msgs;
}
async function getRecentChats(username){
  try{
    const snap = await db.collection('chats').get();
    const chats = [];
    snap.forEach(doc=>{
      const parts = doc.id.split('::');
      if(parts.length !== 2 || !parts.includes(username)) return;
      const other = parts[0] === username ? parts[1] : parts[0];
      const data = doc.data();
      const msgs = (data.messages || []).filter(m=> !(m.deletedFor && m.deletedFor.includes(username)));
      if(msgs.length === 0) return;
      const last = msgs[msgs.length - 1];
      const hiddenAt = data.hiddenAt && data.hiddenAt[username];
      if(hiddenAt && hiddenAt >= last.time) return;
      const unread = msgs.some(m => m.from === other && !m.read);
      chats.push({ other, last, unread, type:'dm' });
    });
    const groups = await getGroupsFor(username);
    const memberIds = new Set(groups.map(g=>g.id));
    for(const g of groups){
      const msgs = await getGroupMessages(g.id);
      const visible = msgs.filter(m=> !(m.deletedFor && m.deletedFor.includes(username)));
      if(visible.length === 0) continue;
      const last = visible[visible.length-1];
      const unread = visible.some(m => m.from !== username && !(m.readBy||[]).includes(username));
      chats.push({ other: g.name, group: g, last, unread, type:'group' });
    }
    const meDoc = await db.collection('users').doc(username).get();
    const leftGroups = (meDoc.exists && meDoc.data().leftGroups) || [];
    const leftAtMap = (meDoc.exists && meDoc.data().leftAt) || {};
    for(const gid of leftGroups){
      if(memberIds.has(gid)) continue;
      const g = await getGroup(gid);
      if(!g) continue;
      const msgs = await getGroupMessages(g.id);
      const leftAt = leftAtMap[gid] || 0;
      const visible = msgs.filter(m=> !(m.deletedFor && m.deletedFor.includes(username)) && (!leftAt || m.time <= leftAt));
      if(visible.length === 0) continue;
      const last = visible[visible.length-1];
      chats.push({ other: g.name, group: g, last, unread:false, type:'group', left:true });
    }
    chats.sort((a,b) => b.last.time - a.last.time);
    return chats;
  }catch(e){ console.error(e); return []; }
}

/* ===================== ÇEVRİMİÇİ DURUMU (heartbeat) =====================
   Kullanıcı uygulamayı açık tuttuğu sürece belli aralıklarla "son aktif" zamanını
   günceller; karşı taraf bunu görüp gerçekten çevrimiçi olup olmadığını anlar. */
let heartbeatTimer = null;
function startHeartbeat(){
  if(heartbeatTimer || !state.currentUser) return;
  const beat = ()=> updateUserField(state.currentUser, { lastActive: Date.now() });
  beat();
  heartbeatTimer = setInterval(beat, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') beat(); });
}
function stopHeartbeat(){
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

  if(!u || !u.verified) return '';
  return `<span class="tick-icon verified-badge" title="Onaylı hesap">${ICONS.blueTick}</span>`;
}
let pollTimer = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ===================== BASILI TUTMA (LONG PRESS) + ALT SAYFA (SHEET) ===================== */
function attachLongPress(el, onLongPress, delay){
  let timer = null;
  let moved = false;
  let startX = 0, startY = 0;
  const start = (e)=>{
    moved = false;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    timer = setTimeout(()=>{
      if(!moved){ if(navigator.vibrate) navigator.vibrate(12); onLongPress(); }
    }, delay || 480);
  };
  const move = (e)=>{
    const p = e.touches ? e.touches[0] : e;
    if(Math.abs(p.clientX-startX) > 10 || Math.abs(p.clientY-startY) > 10) moved = true;
    if(moved && timer){ clearTimeout(timer); timer = null; }
  };
  const cancel = ()=>{ if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', move, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', (e)=> e.preventDefault());
}
function closeSheet(){
  const ex = document.getElementById('active-sheet');
  if(ex) ex.remove();
}
function openSheet(items){
  closeSheet();
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.id = 'active-sheet';
  overlay.innerHTML = `<div class="sheet">
    <div class="sheet-handle"></div>
    ${items.map((it,i)=>`<div class="sheet-item ${it.danger?'danger':''}" data-i="${i}">${it.icon||''}<span>${it.label}</span></div>`).join('')}
  </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeSheet(); });
  overlay.querySelectorAll('.sheet-item').forEach(el=>{
    el.onclick = ()=>{ closeSheet(); items[+el.dataset.i].action(); };
  });
  document.body.appendChild(overlay);
}

/* ===================== PROFİL GÖRÜNTÜLEME (bio bakma) ===================== */
function showProfileModal(username, users){
  const u = users[username];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'active-sheet';
  const name = displayName(username, users);
  overlay.innerHTML = `<div class="modal">
    <div class="avatar profile-modal-avatar">${u && u.avatar ? `<img src="${u.avatar}">` : initials(name)}</div>
    <div class="profile-modal-name">@${name}${u?verifiedBadge(username, users):''}</div>
    <div class="profile-modal-sub">${u ? onlineStatusText(username, users) : ''}</div>
    <div class="profile-modal-bio">
      <div class="profile-modal-bio-label">Hakkında</div>
      ${u && u.bio ? escapeHtml(u.bio) : 'Henüz bir biyografi eklenmemiş.'}
    </div>
    <button class="btn secondary" id="profile-modal-close" style="margin-top:14px;">Kapat</button>
  </div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById('profile-modal-close').onclick = ()=> overlay.remove();
}

function applyTheme(){
  document.body.classList.toggle('dark', state.theme === 'dark');
}

function initials(name){
  return (name||'?').trim().slice(0,2).toUpperCase();
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
}

/* ===================== SECRET ADMIN KEY LISTENER ===================== */
const SECRET = 'opwadminopw';
window.addEventListener('keydown', (e)=>{
  if(e.key.length !== 1) return; // ignore shift/ctrl/etc, still allow letters
  state.keyBuffer = (state.keyBuffer + e.key.toLowerCase()).slice(-SECRET.length);
  if(state.keyBuffer === SECRET){
    state.keyBuffer = '';
    if(state.screen !== 'adminPanel'){
      stopPolling();
      state.screen = 'adminLogin';
      render();
    }
  }
});

/* ===================== RENDER ROOT ===================== */
async function render(){
  applyTheme();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen === 'loading') return renderLoading(app);
  if(state.screen === 'auth') return renderAuth(app);
  if(state.screen === 'main') return renderMain(app);
  if(state.screen === 'chat') return renderChat(app);
  if(state.screen === 'groupChat') return renderGroupChat(app);
  if(state.screen === 'adminLogin') return renderAdminLogin(app);
  if(state.screen === 'adminPanel') return renderAdminPanel(app);
}

function renderLoading(app){
  app.innerHTML = `<div class="center-screen">${brandMark()}</div>`;
}

/* ===================== AUTH SCREEN ===================== */
function renderAuth(app){
  const isLogin = state.authMode === 'login';
  app.innerHTML = `
    <div class="center-screen">
      ${brandMark()}
      <div class="tagline">${isLogin ? 'Hesabına giriş yap' : 'Yeni hesap oluştur'}</div>
      <div class="field">
        <label>Kullanıcı adı</label>
        <input type="text" id="in-username" autocomplete="username" placeholder="kullanici_adi">
      </div>
      <div class="field">
        <label>Parola</label>
        <input type="password" id="in-password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="error-msg" id="auth-error"></div>
      <button class="btn" id="auth-submit">${isLogin ? 'Giriş yap' : 'Hesap oluştur'}</button>
      <button class="link-btn" id="auth-toggle">${isLogin ? 'Hesabın yok mu? Hesap oluştur' : 'Zaten hesabın var mı? Giriş yap'}</button>
    </div>
  `;
  document.getElementById('auth-toggle').onclick = ()=>{
    state.authMode = isLogin ? 'register' : 'login';
    render();
  };
  document.getElementById('auth-submit').onclick = handleAuthSubmit;
  app.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuthSubmit(); });
  });
}

async function handleAuthSubmit(){
  const uname = document.getElementById('in-username').value.trim();
  const pass = document.getElementById('in-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if(!uname || !pass){ errEl.textContent = 'Kullanıcı adı ve parola gerekli.'; return; }
  if(!/^[a-zA-Z0-9_.]{3,20}$/.test(uname)){ errEl.textContent = 'Kullanıcı adı 3-20 karakter, harf/rakam/_ olmalı.'; return; }

  const users = await getUsers();
  if(state.authMode === 'register'){
    if(users[uname]){ errEl.textContent = 'Bu kullanıcı adı zaten alınmış.'; return; }
    if(pass.length < 4){ errEl.textContent = 'Parola en az 4 karakter olmalı.'; return; }
    users[uname] = { password: pass, bio: '', avatar: '', status: '', statusTime: 0, createdAt: Date.now() };
    await saveUsers(users);
    toast('Hesap oluşturuldu!');
    state.currentUser = uname;
  } else {
    const u = users[uname];
    if(!u || u.password !== pass){ errEl.textContent = 'Kullanıcı adı veya parola hatalı.'; return; }
    state.currentUser = uname;
  }
  saveSession(state.currentUser);
  startIncomingCallListener();
  startHeartbeat();
  state.screen = 'main';
  render();
}

      <div class="topbar-user">

      <button data-tab="status" class="${state.activeTab==='status'?'active':''}"><span class="icon">${ICONS.status}</span>Durum</button>

async function renderChatsTab(content, users){
  content.innerHTML = `
    <div class="search-wrap"><div class="search-box"><span class="search-icon-el">${ICONS.search}</span>
      <input type="text" id="user-search" placeholder="Sohbetlerde ara..."></div></div>
    <div id="user-list"></div>
    <button class="fab" id="chats-fab" title="Yeni sohbet">${ICONS.edit}</button>
  `;
  const list = document.getElementById('user-list');
  let recent = await getRecentChats(state.currentUser);
  document.getElementById('chats-fab').onclick = ()=> document.getElementById('user-search').focus();

  const previewFor = (chat)=>{
    const m = chat.last;
    let txt;
    if(m.deleted) txt = 'Bu mesaj silindi';
    else txt = m.type === 'text' ? m.content : (m.type === 'image' ? `${ICONS.camera} Fotoğraf` : `${ICONS.video} Video`);
    const mine = m.from === state.currentUser;
    const tick = (mine && chat.type==='dm') ? `<span class="tick-icon" style="color:${m.read ? 'var(--accent2)' : 'inherit'};opacity:${m.read?1:.7};">${m.read ? ICONS.checkDouble : ICONS.check}</span>` : '';
    const prefix = chat.type==='group' && !mine ? `${m.from}: ` : '';
    return tick + prefix + txt;
  };

  const rowHtml = (chat)=>{
    if(chat.type === 'group'){
      const g = chat.group;
      return `<div class="user-row" data-group="${g.id}" style="${chat.left?`opacity:.6;`:``}">
        <div class="avatar">${g.photo ? `<img src="${g.photo}">` : initials(g.name)}</div>
        <div class="info">
          <div class="uname ${chat.unread ? `unread-name`:``}">${g.name}${chat.left ? ` <span style="font-size:11px;color:var(--text-muted);font-weight:500;">(çıkıldı)</span>` : ``}</div>
          <div class="preview ${chat.unread ? `unread-prev`:``}">${previewFor(chat)}</div>
        </div>
        <div class="meta-col">
          <div class="status-time">${fmtTime(chat.last.time)}</div>
          ${chat.unread ? `<span class="unread-dot"></span>` : ``}
        </div>
      </div>`;
    }
    const u = users[chat.other];
    const name = displayName(chat.other, users);
    return `<div class="user-row" data-user="${chat.other}">
      <div class="avatar">${u && u.avatar ? `<img src="${u.avatar}">` : initials(name)}</div>
      <div class="info">
        <div class="uname ${chat.unread ? 'unread-name':''}">${name}${verifiedBadge(chat.other, users)}</div>
        <div class="preview ${chat.unread ? 'unread-prev':''}">${previewFor(chat)}</div>
      </div>
      <div class="meta-col">
        <div class="status-time">${fmtTime(chat.last.time)}</div>
        ${chat.unread ? `<span class="unread-dot"></span>` : ''}
      </div>
    </div>`;
  };

  const drawRecent = ()=>{
    if(recent.length === 0){
      list.innerHTML = `<div class="empty-hint">${ICONS.bubbleEmpty}<br>Henüz sohbetin yok.<br>Sağ alttaki kalem butonuyla veya arama kutusuyla<br>yeni bir sohbet başlat.</div>`;
      return;
    }
    list.innerHTML = recent.map(rowHtml).join('');
    bindRows(true);
  };

  let searchToken = 0;
  const drawSearch = async (query)=>{
    const q = query.trim().toLowerCase();
    if(!q){ drawRecent(); return; }
    const myToken = ++searchToken;
    list.innerHTML = `<div class="empty-hint">Aranıyor...</div>`;
    const results = [];
    const matchedChats = recent.filter(c=>{
      if(c.type === 'group') return c.group.name.toLowerCase().includes(q);
      return displayName(c.other, users).toLowerCase().includes(q);
    });
    for(const c of matchedChats) results.push({ chat:c });
    try{
      const dmSnap = await db.collection('chats').get();
      dmSnap.forEach(doc=>{
        const parts = doc.id.split('::');
        if(parts.length !== 2 || !parts.includes(state.currentUser)) return;
        const other = parts[0] === state.currentUser ? parts[1] : parts[0];
        const msgs = (doc.data().messages || []).filter(m=> !(m.deletedFor && m.deletedFor.includes(state.currentUser)) && !m.deleted && m.type === 'text' && m.content && m.content.toLowerCase().includes(q));
        if(msgs.length === 0) return;
        const chat = recent.find(c=> c.type==='dm' && c.other === other);
        results.push({ chat: chat || { other, type:'dm', last: msgs[msgs.length-1], unread:false }, messages: msgs });
      });
      const groups = await getGroupsFor(state.currentUser);
      for(const g of groups){
        const msgs = (await getGroupMessages(g.id)).filter(m=> !(m.deletedFor && m.deletedFor.includes(state.currentUser)) && !m.deleted && m.type === 'text' && m.content && m.content.toLowerCase().includes(q));
        if(msgs.length === 0) continue;
        const chat = recent.find(c=> c.type==='group' && c.group && c.group.id === g.id);
        results.push({ chat: chat || { other:g.name, group:g, type:'group', last:msgs[msgs.length-1], unread:false }, messages: msgs });
      }
    }catch(e){ console.error(e); }
    const seen = new Set();
    const deduped = [];
    for(const r of results){
      const key = r.chat.type === 'group' ? 'g:'+(r.chat.group&&r.chat.group.id) : 'd:'+r.chat.other;
      if(seen.has(key)) continue;
      seen.add(key); deduped.push(r);
    }
    if(myToken !== searchToken) return;
    if(deduped.length === 0){
      list.innerHTML = `<div class="empty-hint">Sonuç bulunamadı.</div>`;
      return;
    }
    let h = '';
    for(const r of deduped){
      h += rowHtml(r.chat);
      if(r.messages){
        for(const m of r.messages.slice(0,3)){
          const ck = r.chat.type==='group' ? ('g:'+(r.chat.group&&r.chat.group.id)) : ('d:'+r.chat.other);
          h += '<div class="search-msg-result" data-chat-key="'+ck+'" data-msg-id="'+m.id+'"><div class="smr-preview">'+escapeHtml(m.content)+'</div><div class="smr-time">'+fmtTime(m.time)+'</div></div>';
        }
      }
    }
    list.innerHTML = h;
    bindRows(false);
    list.querySelectorAll('.search-msg-result').forEach(el=>{
      el.onclick = ()=>{
        const key = el.dataset.chatKey;
        const msgId = el.dataset.msgId;
        if(key.startsWith('g:')){ state.activeGroupId = key.slice(2); state.screen='groupChat'; }
        else { state.chatWith = key.slice(2); state.screen='chat'; }
        state.pendingScrollMsgId = msgId;
        render();
      };
    });
  };

  function bindRows(isRecent){
    list.querySelectorAll('.user-row').forEach(row=>{
      row.onclick = ()=>{
        if(row.dataset.group){
          state.activeGroupId = row.dataset.group;
          state.screen = 'groupChat';
        } else {
          state.chatWith = row.dataset.user;
          state.screen = 'chat';
        }
        render();
      };
      if(isRecent){
        attachLongPress(row, ()=>{
          if(row.dataset.group){
            const chat = recent.find(c=> c.group && c.group.id === row.dataset.group);
            if(chat && chat.left){
              openSheet([
                { label:'Sohbeti sil', icon:ICONS.trash, danger:true, action: async ()=>{
                  await removeLeftGroup(row.dataset.group, state.currentUser);
                  recent = recent.filter(c=> !(c.group && c.group.id === row.dataset.group));
                  drawRecent();
                  toast('Sohbet silindi');
                }}
              ]);
            } else {
              openSheet([
                { label:'Bu gruptaki tüm mesajları sil', icon:ICONS.trash, danger:true, action: async ()=>{
                  await clearGroupMessagesForMe(row.dataset.group, state.currentUser);
                  recent = recent.filter(c=> !(c.group && c.group.id === row.dataset.group));
                  drawRecent();
                  toast('Mesajlar silindi');
                }},
                { label:'Gruptan çık', icon:ICONS.exit, danger:true, action: async ()=>{
                  await leaveGroup(row.dataset.group, state.currentUser);
                  recent = recent.filter(c=> !(c.group && c.group.id === row.dataset.group));
                  drawRecent();
                  toast('Gruptan çıkıldı');
                }}
              ]);
            }
          } else {
            openSheet([
              { label:'Sohbeti sil', icon:ICONS.trash, danger:true, action: async ()=>{
                await deleteChatForMe(row.dataset.user, state.currentUser);
                recent = recent.filter(c=> c.other !== row.dataset.user);
                drawRecent();
                toast('Sohbet silindi');
              }}
            ]);
          }
        });
      }
    });
  }

  drawRecent();
  let searchTimer = null;
  document.getElementById('user-search').addEventListener('input', (e)=>{
    const q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{ if(!q.trim()) drawRecent(); else drawSearch(q); }, 280);
  });
}

function renderStatusTab(content, users){
  const me = users[state.currentUser] || {};
  const others = Object.keys(users).filter(n=>n!==state.currentUser && users[n].status);
  content.innerHTML = `
    <div class="add-status-box">
      <label style="font-size:12px;color:var(--text-muted);">Durumun</label>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <input type="text" id="status-input" placeholder="Ne düşünüyorsun?" value="${me.status ? me.status.replace(/"/g,'&quot;') : ''}">
        <button class="icon-btn send" id="status-save">${ICONS.check}</button>
      </div>
      ${me.statusTime ? `<div class="status-time" style="margin-top:6px;">Son güncelleme: ${fmtTime(me.statusTime)}</div>` : ''}
    </div>
    <div id="status-list"></div>
  `;
  const listEl = document.getElementById('status-list');
  if(others.length === 0){
    listEl.innerHTML = `<div class="empty-hint">Henüz kimse durum paylaşmamış.</div>`;
  } else {
    listEl.innerHTML = others.map(n=>{
      const u = users[n];
      return `<div class="status-row">
        <div class="status-ring"><div class="avatar">${u.avatar ? `<img src="${u.avatar}">` : initials(n)}</div></div>
        <div>
          <div class="uname" style="font-weight:600;">${n}${verifiedBadge(n, users)}</div>
          <div class="status-text">${u.status}</div>
          <div class="status-time">${fmtTime(u.statusTime)}</div>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('status-save').onclick = async ()=>{
    const val = document.getElementById('status-input').value.trim();
    const usersNow = await getUsers();
    usersNow[state.currentUser].status = val;
    usersNow[state.currentUser].statusTime = Date.now();
    await saveUsers(usersNow);
    toast('Durum güncellendi');
    render();
  };
}

/* ===================== KİŞİLER (CONTACTS) ===================== */
async function renderContactsTab(content, users){
  const me = users[state.currentUser] || {};
  const contactNames = (me.contacts || []).filter(n=> n !== state.currentUser);
  content.innerHTML = `
    <div class="contacts-header">
      <div class="search-wrap" style="flex:1;"><div class="search-box"><span class="search-icon-el">${ICONS.search}</span>
        <input type="text" id="contact-search" placeholder="Kişilerde ara..."></div></div>
      <div class="top-actions">
        <button class="circle-btn" id="add-contact-btn" title="Kişi ekle" style="background:var(--accent);">${ICONS.personAdd}</button>
        <button class="circle-btn" id="add-group-btn" title="Yeni grup" style="background:var(--accent2);">${ICONS.group}</button>
      </div>
    </div>
    <div id="contact-list"></div>
  `;
  // ust bardaki mavi degrade uzerinde beyaz gorunsun diye stil override
  content.querySelector('.top-actions').querySelectorAll('.circle-btn').forEach(b=>{ b.style.color='#fff'; });
  const list = document.getElementById('contact-list');
  const draw = (filter)=>{
    let names = contactNames;
    if(filter && filter.trim()) names = names.filter(n=> n.toLowerCase().includes(filter.trim().toLowerCase()));
    if(names.length === 0){
      list.innerHTML = `<div class="empty-hint">${ICONS.contacts}<br>Henüz kişin yok.<br>Sağ üstteki + ile yeni kişi ekle.</div>`;
      return;
    }
    list.innerHTML = names.map(n=>{
      const u = users[n];
      const name = displayName(n, users);
      return `<div class="user-row" data-user="${n}">
        <div class="avatar">${u && u.avatar ? `<img src="${u.avatar}">` : initials(name)}</div>
        <div class="info">
          <div class="uname">${name}${u?verifiedBadge(n, users):''}</div>
          <div class="preview">${u ? (u.bio || 'TheDeepChat kullanıcısı') : 'Bu hesap silindi'}</div>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.user-row').forEach(row=>{
      row.onclick = ()=>{ state.chatWith = row.dataset.user; state.screen='chat'; render(); };
      const av = row.querySelector('.avatar');
      if(av) av.onclick = (e)=>{ e.stopPropagation(); showProfileModal(row.dataset.user, users); };
      attachLongPress(row, ()=>{
        openSheet([
          { label:'Profili gör', icon:ICONS.contacts, action: ()=> showProfileModal(row.dataset.user, users) },
          { label:'Kişiyi sil', icon:ICONS.trash, danger:true, action: async ()=>{
            await removeContact(state.currentUser, row.dataset.user);
            toast('Kişi silindi');
            render();
          }}
        ]);
      });
    });
  };
  draw();
  document.getElementById('contact-search').addEventListener('input', e=> draw(e.target.value));
  document.getElementById('add-contact-btn').onclick = ()=> openAddContactModal(users, ()=> render());
  document.getElementById('add-group-btn').onclick = ()=> openCreateGroupModal(users);
}

    <h3>Kişi ekle</h3>

function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function msgSig(m){ return m.id + ':' + (m.read?1:0) + ':' + (m.deleted?1:0) + ':' + ((m.deletedFor||[]).length); }

function bubbleHtml(m, showSender){
  const mine = m.from === state.currentUser;
  let bodyHtml = '';
  if(m.deleted){
    bodyHtml = `<div><span class="del-icon">${ICONS.trash}</span>Bu mesaj silindi</div>`;
  } else if(m.type === 'text') bodyHtml = `<div>${escapeHtml(m.content)}</div>`;
  else if(m.type === 'image') bodyHtml = `<img src="${m.content}">`;
  else if(m.type === 'video') bodyHtml = `<video src="${m.content}" controls></video>`;
  const tick = (mine && currentChatMeta.type==='dm') ? `<span class="tick-icon" style="opacity:.9;">${m.read ? ICONS.checkDouble : ICONS.check}</span>` : '';
  const senderHtml = (showSender && !mine) ? `<div class="sender-name">${displayName(m.from, currentChatMeta.otherUsers)}</div>` : '';
  return `<div class="bubble ${mine?'out':'in'} ${m.deleted?'deleted':''}" data-id="${m.id}" data-mine="${mine?'1':'0'}" data-time="${m.time}">${senderHtml}${bodyHtml}<div class="time">${tick}${fmtTime(m.time)}</div></div>`;
}

function attachBubbleMenu(el, m){
  // Mesaj nesnesini kapanımda (closure) sabitlemek yerine her açılışta
  // baloncuktaki GERÇEK data-id üzerinden tekrar buluyoruz. Böylece
  // canlı güncelleme / yeniden çizim sonrası eski mesajın id'si kullanılmaz.
  el.dataset.bound = '1';

  const getCurrentMessage = ()=>{
    const msgId = el.dataset.id;
    return currentMsgsCache.find(x => x.id === msgId) || m;
  };

  const delForMe = ()=> openSheet([
    { label:'Benden sil', icon:ICONS.trash, action: async ()=>{
      const msg = getCurrentMessage();
      if(!msg || !msg.id) return;
      await deleteMessageForMe(currentChatMeta.type, currentChatMeta.id, msg.id, state.currentUser);
    }}
  ]);

  if(m.deleted){ el.onclick = delForMe; return; }

  // Her baloncuk kendi data-id'sinden işlem gördüğü için komşu mesajın
  // closure'ına yanlışlıkla bağlanmaz.
  attachLongPress(el, ()=>{
    const msg = getCurrentMessage();
    if(!msg || !msg.id) return;

    const items = [
      { label:'Benden sil', icon:ICONS.trash, action: async ()=>{
        await deleteMessageForMe(currentChatMeta.type, currentChatMeta.id, msg.id, state.currentUser);
      }}
    ];

    const mine = msg.from === state.currentUser;
    const within24h = (Date.now() - msg.time) < 24*60*60*1000;

    if(mine && within24h){
      items.push({
        label:'Herkesten sil',
        icon:ICONS.close,
        danger:true,
        action: async ()=>{
          // Ek güvenlik: "Herkesten sil" sadece mesajın gerçek sahibi
          // tarafından çalıştırılabilir.
          const latest = getCurrentMessage();
          if(!latest || latest.from !== state.currentUser) return;
          await deleteMessageForEveryone(currentChatMeta.type, currentChatMeta.id, latest.id);
        }
      });
    }
    openSheet(items);
  }, 420);
}

// Sunucudan gelen mesaj dizisini önceki ekranla karşılaştırıp sadece
// farkı günceller: tam yeniden çizim yapmadığı için ekran titremez.
function renderMessagesDiff(rawMsgs, users){
  const box = document.getElementById('messages');
  if(!box) { stopPolling(); return; }
  const msgs = rawMsgs.filter(m=> !(m.deletedFor && m.deletedFor.includes(state.currentUser)));

  if(msgs.length === 0){
    box.innerHTML = `<div class="empty-hint">Henüz mesaj yok. İlk mesajı gönder</div>`;
    currentMsgsCache = [];
    return;
  }

  const isGroup = currentChatMeta.type === 'group';
  const oldMsgs = currentMsgsCache;
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;

  let firstDiff = 0;
  const minLen = Math.min(oldMsgs.length, msgs.length);
  while(firstDiff < minLen && msgSig(oldMsgs[firstDiff]) === msgSig(msgs[firstDiff])) firstDiff++;

  if(firstDiff === oldMsgs.length && msgs.length >= oldMsgs.length){
    // sadece yeni mesajlar eklenmiş: mevcut baloncuklara dokunma, sadece yenilerini ekle (titremesiz)
    if(oldMsgs.length === 0) box.innerHTML = '';
    for(let i = firstDiff; i < msgs.length; i++){
      const showSender = isGroup && (i===0 || msgs[i-1].from !== msgs[i].from);
      box.insertAdjacentHTML('beforeend', bubbleHtml(msgs[i], showSender));
    }
  } else {
    // bir mesaj değişti (okundu/silindi) ya da sıralama farklı: sadece bu kısmı yeniden çiz
    box.innerHTML = msgs.map((m,i)=> bubbleHtml(m, isGroup && (i===0 || msgs[i-1].from !== msgs[i].from))).join('');
  }
  box.querySelectorAll('.bubble').forEach((el,i)=> attachBubbleMenu(el, msgs[i]));
  currentMsgsCache = msgs;
  if(state.pendingScrollMsgId){
    const target = box.querySelector(`.bubble[data-id="${state.pendingScrollMsgId}"]`);
    if(target){ target.scrollIntoView({block:'center'}); target.style.transition='box-shadow .4s'; target.style.boxShadow='0 0 0 8px rgba(24,119,209,.18)'; setTimeout(()=>{ target.style.boxShadow=''; },1600); }
    state.pendingScrollMsgId = null;
  } else if(atBottom || oldMsgs.length === 0) box.scrollTop = box.scrollHeight;
}

// Mesajı ekrana anında ekler (sunucuya yazma tamamlanmasını beklemeden)
function appendOptimistic(msg){
  const box = document.getElementById('messages');
  const isGroup = currentChatMeta.type === 'group';
  currentMsgsCache = [...currentMsgsCache, msg];
  if(!box) return;
  if(currentMsgsCache.length === 1) box.innerHTML = '';
  const showSender = isGroup && currentMsgsCache.length>1 && currentMsgsCache[currentMsgsCache.length-2].from !== msg.from;
  box.insertAdjacentHTML('beforeend', bubbleHtml(msg, showSender));
  const el = box.querySelector(`.bubble[data-id="${msg.id}"]`);
  if(el) attachBubbleMenu(el, msg);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function sendTextMessage(){
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  const msg = { id: genId(), from: state.currentUser, type:'text', content:text, time: Date.now(), read:false };
  appendOptimistic(msg);
  if(currentChatMeta.type === 'group') await pushGroupMessage(currentChatMeta.id, msg);
  else await pushMessage(state.currentUser, state.chatWith, msg);
}

async function sendMediaMessage(e, type){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const maxSize = type === 'video' ? 4_500_000 : 1_500_000;
  if(file.size > maxSize){
    toast(`Dosya çok büyük (max ~${type==='video'?'4.5MB video':'1.5MB fotoğraf'})`);
    return;
  }
  const dataUrl = await fileToDataURL(file);
  const msg = { id: genId(), from: state.currentUser, type, content:dataUrl, time: Date.now(), read:false };
  appendOptimistic(msg);
  if(currentChatMeta.type === 'group') await pushGroupMessage(currentChatMeta.id, msg);
  else await pushMessage(state.currentUser, state.chatWith, msg);
}

/* ===================== SESLİ / GÖRÜNTÜLÜ ARAMA (WebRTC) =====================
   Sinyal (offer/answer/ICE) Firestore üzerinden taşınır, gerçek ses/görüntü
   akışı ise WebRTC ile doğrudan iki tarayıcı arasında (peer-to-peer) gider.
================================================================================ */
const RTC_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};
let pc = null;
let localStream = null;
let remoteStream = null;
let callDocUnsub = null;
let incomingCallUnsub = null;
let callTimerInterval = null;
state.call = null; // { id, otherUser, type, role, status, callerProcessed, calleeProcessed, startedAtLocal }

function startIncomingCallListener(){
  if(incomingCallUnsub || !state.currentUser) return;
  incomingCallUnsub = db.collection('calls')
    .where('callee', '==', state.currentUser)
    .onSnapshot(snap=>{
      snap.docChanges().forEach(change=>{
        const data = change.doc.data();
        const id = change.doc.id;
        if(!data) return;
        if(data.status === 'ringing' && !state.call){
          showIncomingCall(id, data);
        }
        if((data.status === 'ended' || data.status === 'rejected') && state.call && state.call.id === id){
          if(state.call.status === 'ringing' && state.call.role === 'callee'){
            hideIncomingCallOverlay();
          } else {
            toast(data.status === 'rejected' ? 'Arama reddedildi' : 'Arama sona erdi');
          }
          cleanupCall();
        }
      });
    }, err=> console.error('incoming call listener error', err));
}
function stopIncomingCallListener(){
  if(incomingCallUnsub){ incomingCallUnsub(); incomingCallUnsub = null; }
}

function createPeerConnection(callId, role){
  const conn = new RTCPeerConnection(RTC_CONFIG);
  conn.onicecandidate = (e)=>{
    if(e.candidate){
      const field = role === 'caller' ? 'callerCandidates' : 'calleeCandidates';
      db.collection('calls').doc(callId).update({
        [field]: firebase.firestore.FieldValue.arrayUnion(e.candidate.toJSON())
      }).catch(()=>{});
    }
  };
  conn.ontrack = (e)=>{
    remoteStream = e.streams[0];
    const remoteVideo = document.getElementById('remote-video');
    if(remoteVideo) remoteVideo.srcObject = remoteStream;
    const remoteAudio = document.getElementById('remote-audio');
    if(remoteAudio) remoteAudio.srcObject = remoteStream;
  };
  conn.onconnectionstatechange = ()=>{
    if(['failed','disconnected','closed'].includes(conn.connectionState) && state.call){
      // bağlantı koptu, temizle (kullanıcıya bilgi vermeden sessizce)
    }
  };
  return conn;
}

async function startOutgoingCall(otherUser, type){
  if(!otherUser){ toast('Kullanıcı bulunamadı'); return; }
  if(state.call){ toast('Zaten bir görüşmedesin'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Bu tarayıcı arama özelliğini desteklemiyor'); return;
  }
  if(typeof RTCPeerConnection === 'undefined'){
    toast('Bu tarayıcı arama özelliğini desteklemiyor'); return;
  }
  const callId = chatKey(state.currentUser, otherUser);
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio:true, video: type === 'video' });
  }catch(e){
    toast('Kamera/mikrofon izni gerekli'); return;
  }
  localStream = stream;
  state.call = { id: callId, otherUser, type, role:'caller', status:'ringing', callerProcessed:0, calleeProcessed:0, camOn:type==='video', micOn:true };
  renderCallOverlay();
  pc = createPeerConnection(callId, 'caller');
  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));
  let offer;
  try{
    offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
  }catch(e){ console.error(e); toast('Arama başlatılamadı'); cleanupCall(); return; }
  try{
    await db.collection('calls').doc(callId).set({
      caller: state.currentUser, callee: otherUser, type, status:'ringing',
      offer: { type: offer.type, sdp: offer.sdp }, answer: null,
      callerCandidates: [], calleeCandidates: [], startedAt: Date.now()
    });
  }catch(e){ console.error(e); toast('Arama başlatılamadı'); cleanupCall(); return; }
  listenToCallDoc(callId);
}

function showIncomingCall(callId, data){
  state.call = { id: callId, otherUser: data.caller, type: data.type, role:'callee', status:'ringing', callerProcessed:0, calleeProcessed:0, camOn:data.type==='video', micOn:true, _incomingData: data };
  renderCallOverlay();
}

async function acceptIncomingCall(){
  if(!state.call || state.call.role !== 'callee') return;
  const callId = state.call.id;
  const data = state.call._incomingData;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio:true, video: state.call.type === 'video' });
  }catch(e){
    toast('Kamera/mikrofon izni gerekli');
    declineIncomingCall();
    return;
  }
  localStream = stream;
  pc = createPeerConnection(callId, 'callee');
  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));
  try{
    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    const existingCandidates = data.callerCandidates || [];
    for(const c of existingCandidates){
      try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    }
    state.call.callerProcessed = existingCandidates.length;
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await db.collection('calls').doc(callId).update({
      status:'accepted', answer:{ type: answer.type, sdp: answer.sdp }
    });
  }catch(e){ console.error(e); toast('Arama kabul edilemedi'); cleanupCall(); return; }
  state.call.status = 'accepted';
  state.call.startedAtLocal = Date.now();
  renderCallOverlay();
  listenToCallDoc(callId);
}

function declineIncomingCall(){
  if(!state.call) return;
  db.collection('calls').doc(state.call.id).update({ status:'rejected' }).catch(()=>{});
  cleanupCall();
}

function listenToCallDoc(callId){
  if(callDocUnsub){ callDocUnsub(); callDocUnsub = null; }
  callDocUnsub = db.collection('calls').doc(callId).onSnapshot(async (doc)=>{
    if(!doc.exists || !state.call || state.call.id !== callId) return;
    const data = doc.data();
    if(state.call.role === 'caller' && data.answer && pc && !pc.currentRemoteDescription){
      try{ await pc.setRemoteDescription(new RTCSessionDescription(data.answer)); }catch(e){ console.error(e); }
    }
    const otherField = state.call.role === 'caller' ? 'calleeCandidates' : 'callerCandidates';
    const processedKey = state.call.role === 'caller' ? 'calleeProcessed' : 'callerProcessed';
    const list = data[otherField] || [];
    const startIdx = state.call[processedKey] || 0;
    for(let i=startIdx;i<list.length;i++){
      try{ await pc.addIceCandidate(new RTCIceCandidate(list[i])); }catch(e){}
    }
    state.call[processedKey] = list.length;
    if(data.status === 'accepted' && state.call.status !== 'accepted'){
      state.call.status = 'accepted';
      state.call.startedAtLocal = Date.now();
      renderCallOverlay();
    }
    if(data.status === 'rejected'){
      toast('Arama reddedildi');
      cleanupCall();
    }
    if(data.status === 'ended'){
      toast('Arama sona erdi');
      cleanupCall();
    }
  }, err=> console.error('call doc listener error', err));
}

function endCall(){
  if(state.call){
    db.collection('calls').doc(state.call.id).update({ status:'ended', endedAt: Date.now() }).catch(()=>{});
  }
  cleanupCall();
}

function cleanupCall(){
  if(callTimerInterval){ clearInterval(callTimerInterval); callTimerInterval = null; }
  if(callDocUnsub){ callDocUnsub(); callDocUnsub = null; }
  if(pc){ try{ pc.close(); }catch(e){} pc = null; }
  if(localStream){ localStream.getTracks().forEach(t=> t.stop()); localStream = null; }
  remoteStream = null;
  state.call = null;
  hideIncomingCallOverlay();
}

function hideIncomingCallOverlay(){
  const root = document.getElementById('call-overlay-root');
  if(root) root.innerHTML = '';
}

function fmtCallDuration(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,`0`)}`;
}
async function flipCamera(){
  if(!state.call || !localStream) return;
  const videoTrack = localStream.getVideoTracks()[0];
  if(!videoTrack) return;
  const currentFacing = videoTrack.getSettings().facingMode;
  const newFacing = currentFacing === 'user' ? 'environment' : 'user';
  try{
    const newStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:newFacing }, audio:false });
    const newTrack = newStream.getVideoTracks()[0];
    const sender = pc && pc.getSenders().find(s=> s.track && s.track.kind === 'video');
    if(sender) await sender.replaceTrack(newTrack);
    videoTrack.stop();
    localStream.removeTrack(videoTrack);
    localStream.addTrack(newTrack);
    const lv = document.getElementById('local-video');
    if(lv) lv.srcObject = localStream;
    toast('Kamera çevrildi');
  }catch(e){ console.error(e); toast('Kamera çevrilemedi'); }
}

}
function makeLocalVideoDraggable(){
  const lv = document.getElementById('local-video');
  if(!lv) return;
  const wrap = lv.parentElement;
  if(!wrap) return;
  const corners = {
    'tl': { top:'14px', left:'14px', right:'auto', bottom:'auto' },
    'tr': { top:'14px', right:'14px', left:'auto', bottom:'auto' },
    'bl': { bottom:'14px', left:'14px', right:'auto', top:'auto' },
    'br': { bottom:'14px', right:'14px', left:'auto', top:'auto' }
  };
  const applyCorner = (c)=>{ Object.assign(lv.style, corners[c]); };
  applyCorner('br');
  let dragging = false, startX=0, startY=0, origLeft=0, origTop=0;
  const onStart = (e)=>{
    dragging = true;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    const r = lv.getBoundingClientRect();
    origLeft = r.left; origTop = r.top;
    lv.style.transition = 'none';
  };
  const onMove = (e)=>{
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX;
    const dy = p.clientY - startY;
    const wr = wrap.getBoundingClientRect();
    const nl = Math.max(0, Math.min(wr.width - lv.offsetWidth, origLeft - wr.left + dx));
    const nt = Math.max(0, Math.min(wr.height - lv.offsetHeight, origTop - wr.top + dy));
    lv.style.left = nl + 'px';
    lv.style.top = nt + 'px';
    lv.style.right = 'auto';
    lv.style.bottom = 'auto';
  };
  const onEnd = ()=>{
    if(!dragging) return;
    dragging = false;
    lv.style.transition = 'left .18s ease, top .18s ease, right .18s ease, bottom .18s ease';
    const r = lv.getBoundingClientRect();
    const wr = wrap.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    const left = cx < (wr.left + wr.width/2);
    const top = cy < (wr.top + wr.height/2);
    applyCorner((top?'t':'b') + (left?'l':'r'));
  };
  lv.addEventListener('touchstart', onStart, {passive:true});
  lv.addEventListener('touchmove', onMove, {passive:true});
  lv.addEventListener('touchend', onEnd);
  lv.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}
