}
function makeLocalVideoDraggable(){
  const lv = document.getElementById('local-video');
  if(!lv) return;
  const wrap = lv.parentElement;
  if(!wrap) return;
  const corners = {
    'tl': { top:'14px', left:'14px', right:'auto', bottom:'auto' },
    'tr': { top:'14px', right:'14px', left:'auto', bottom:'auto' },
    'bl': { bottom:'14px', left:'14px', right:'auto', top:'auto' },
    'br': { bottom:'14px', right:'14px', left:'auto', top:'auto' }
  };
  const applyCorner = (c)=>{ Object.assign(lv.style, corners[c]); };
  applyCorner('br');
  let dragging = false, startX=0, startY=0, origLeft=0, origTop=0;
  const onStart = (e)=>{
    dragging = true;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    const r = lv.getBoundingClientRect();
    origLeft = r.left; origTop = r.top;
    lv.style.transition = 'none';
  };
  const onMove = (e)=>{
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX;
    const dy = p.clientY - startY;
    const wr = wrap.getBoundingClientRect();
    const nl = Math.max(0, Math.min(wr.width - lv.offsetWidth, origLeft - wr.left + dx));
    const nt = Math.max(0, Math.min(wr.height - lv.offsetHeight, origTop - wr.top + dy));
    lv.style.left = nl + 'px';
    lv.style.top = nt + 'px';
    lv.style.right = 'auto';
    lv.style.bottom = 'auto';
  };
  const onEnd = ()=>{
    if(!dragging) return;
    dragging = false;
    lv.style.transition = 'left .18s ease, top .18s ease, right .18s ease, bottom .18s ease';
    const r = lv.getBoundingClientRect();
    const wr = wrap.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    const left = cx < (wr.left + wr.width/2);
    const top = cy < (wr.top + wr.height/2);
    applyCorner((top?'t':'b') + (left?'l':'r'));
  };
  lv.addEventListener('touchstart', onStart, {passive:true});
  lv.addEventListener('touchmove', onMove, {passive:true});
  lv.addEventListener('touchend', onEnd);
  lv.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

          <div class="call-status">${c.type === 'video' ? 'Görüntülü arama...' : 'Sesli arama...'}</div>
        </div>

          <button class="call-btn accept" id="call-accept" title="Kabul et">${ICONS.phone}</button>

          <div class="call-status">Aranıyor...</div>
        </div>
        <div></div>
        <div class="call-controls">
          <button class="call-btn end" id="call-cancel" title="Aramayı iptal et">${ICONS.hangup}</button>
        </div>
      </div>
    `;
    document.getElementById('call-cancel').onclick = endCall;
    return;
  }

  if(c.status === 'accepted'){
    const isVideo = c.type === 'video';
    root.innerHTML = `
      <div class="call-overlay" style="padding:0;justify-content:space-between;">
        ${isVideo ? `
          <div class="call-video-wrap" style="position:absolute;inset:0;">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
          </div>
          <div style="position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;">
            <div class="call-name" style="font-size:18px;">${c.otherUser}${verifiedBadge(c.otherUser, users)}</div>
            <div class="call-status" id="call-timer" style="font-size:13px;">00:00</div>
          </div>
        ` : `
          <audio id="remote-audio" autoplay style="display:none;"></audio>
          <div class="call-top" style="margin-top:60px;">
            <div class="call-avatar" style="width:130px;height:130px;font-size:44px;">${avatarHtml}</div>
            <div class="call-name">${c.otherUser}${verifiedBadge(c.otherUser, users)}</div>
            <div class="call-status" id="call-timer">00:00</div>
          </div>
        `}
        <div style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:3;">
          <div class="call-pill">
            ${isVideo ? `<button class="pill-btn" id="call-flip" title="Kamerayı çevir">${ICONS.flipCam}</button>` : ``}
            ${isVideo ? `<button class="pill-btn ${c.camOn?`active`:``}" id="call-cam" title="Kamera">${c.camOn ? ICONS.camOn : ICONS.camOff}</button>` : ``}
            <button class="pill-btn" id="call-speaker" title="Hoparlör seç">${ICONS.speaker}</button>
            <button class="pill-btn ${c.micOn?`active`:``}" id="call-mic" title="Mikrofon">${c.micOn ? ICONS.micOn : ICONS.micOff}</button>
            <button class="pill-btn end" id="call-hangup" title="Aramayı kapat">${ICONS.hangup}</button>
          </div>
        </div>
      </div>
    `;
    if(localStream){
      if(isVideo){
        const lv = document.getElementById('local-video');
        if(lv) lv.srcObject = localStream;
      }
    }
    if(remoteStream){
      if(isVideo){
        const rv = document.getElementById('remote-video');
        if(rv) rv.srcObject = remoteStream;
      } else {
        const ra = document.getElementById('remote-audio');
        if(ra) ra.srcObject = remoteStream;
      }
    }
    document.getElementById('call-hangup').onclick = endCall;
    document.getElementById('call-mic').onclick = ()=>{
      c.micOn = !c.micOn;
      if(localStream) localStream.getAudioTracks().forEach(t=> t.enabled = c.micOn);
      renderCallOverlay();
    };
    document.getElementById('call-speaker').onclick = openSpeakerPicker;
    if(isVideo){
      document.getElementById('call-cam').onclick = ()=>{
        c.camOn = !c.camOn;
        if(localStream) localStream.getVideoTracks().forEach(t=> t.enabled = c.camOn);
        renderCallOverlay();
      };
      document.getElementById('call-flip').onclick = flipCamera;
      makeLocalVideoDraggable();
    }
    if(callTimerInterval) clearInterval(callTimerInterval);
    const startedAt = c.startedAtLocal || Date.now();
    callTimerInterval = setInterval(()=>{
      const el = document.getElementById('call-timer');
      if(el) el.textContent = fmtCallDuration(Date.now() - startedAt);
    }, 1000);
  }
}

/* ===================== INIT ===================== */
(async function init(){
  state.theme = await getTheme();
  const savedUser = getSession();
  if(savedUser){
    // Kayıtlı oturum var mı ve kullanıcı hâlâ mevcut mu diye kontrol et
    const users = await getUsers();
    if(users[savedUser] && users[savedUser].banned){
      clearSession();
      auth.signOut().catch(e=>console.error(e));
      state.screen = 'auth';
      render();
      return;
    }
    if(users[savedUser]){
      state.currentUser = savedUser;
      state.screen = 'main';
      startIncomingCallListener();
      startHeartbeat();
      render();
      return;
    } else {
      clearSession();
    }
  }
  state.screen = 'auth';
  render();
})();
</script>
</body>
</html>
